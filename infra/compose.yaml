services:
  postgres:
    image: postgres:16-alpine
    container_name: ardor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ardor_pressure_test
      POSTGRES_USER: ardor_user
      POSTGRES_PASSWORD: ardor_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ardor_user -d ardor_pressure_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ardor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: ardor-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://ardor_user:ardor_password@postgres:5432/ardor_pressure_test
      REDIS_URL: redis://redis:6379/0
      STORAGE_DIR: /data/storage
    ports:
      - "8000:8000"
    volumes:
      - storage_data:/data/storage

volumes:
  postgres_data:
  storage_data:
