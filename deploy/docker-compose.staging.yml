version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    container_name: ardor_api_staging
    environment:
      - ARDOR_ENV=staging
      - DATABASE_URL=postgresql://ardor_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/ardor_pressure_test
      - STORAGE_DIR=/data/storage
      - SECRET_KEY=${ARDOR_JWT_SECRET:?ARDOR_JWT_SECRET must be set}
      - ARDOR_CORS_ORIGINS=${ARDOR_CORS_ORIGINS:?ARDOR_CORS_ORIGINS must be set}
      - ARDOR_PUBLIC_ORIGIN=${ARDOR_PUBLIC_ORIGIN:?ARDOR_PUBLIC_ORIGIN must be set}
      - ARDOR_SHARE_SECRET=${ARDOR_SHARE_SECRET:?ARDOR_SHARE_SECRET must be set}
      - ARDOR_LEGACY_SHARE_LINKS=${ARDOR_LEGACY_SHARE_LINKS:-on}
    volumes:
      - ardor_storage:/data/storage
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    restart: unless-stopped

  web:
    build:
      context: ../apps/web
      dockerfile: ../deploy/Dockerfile.web
    container_name: ardor_web_staging
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ardor_postgres_staging
    environment:
      - POSTGRES_USER=ardor_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - POSTGRES_DB=ardor_pressure_test
    volumes:
      - ardor_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  ardor_storage:
  ardor_pgdata:
