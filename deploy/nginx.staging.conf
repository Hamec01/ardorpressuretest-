# Link-preview bots (WhatsApp, Telegram, ...) do not run JavaScript: for share links they
# get a tiny Open Graph page from the API instead of the SPA (docs/ACCESS_PLAN_R4-R7.md).
map $http_user_agent $ardor_link_preview_bot {
    default 0;
    "~*(whatsapp|facebookexternalhit|facebot|telegrambot|twitterbot|slackbot|linkedinbot|discordbot|viber|skypeuripreview|microsoftpreview|teams|pinterest|redditbot|embedly|vkshare|mattermost|signal|applebot|googlebot|bingbot|iframely)" 1;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 0;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(s|share)/[^/]+/?$ {
        if ($ardor_link_preview_bot) {
            rewrite ^/(s|share)/([^/]+)/?$ /api/v1/public/preview-page/$1/$2 break;
            proxy_pass http://api:8000;
        }
        try_files $uri /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
