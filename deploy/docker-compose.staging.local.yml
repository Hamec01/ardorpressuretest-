services:
  api:
    image: ardor-api-staging:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api.staging
    volumes:
      - ../alembic.ini:/app/alembic.ini:ro
      - ../migrations:/app/migrations:ro
    environment:
      ARDOR_ENV: staging
      DATABASE_URL: postgresql://ardor_user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@postgres:5432/ardor_pressure_test
      STORAGE_DIR: /data/storage
      SECRET_KEY: ${ARDOR_JWT_SECRET:?ARDOR_JWT_SECRET must be set}
      ARDOR_CORS_ORIGINS: ${ARDOR_CORS_ORIGINS:?ARDOR_CORS_ORIGINS must be set}
      ARDOR_PUBLIC_ORIGIN: ${ARDOR_PUBLIC_ORIGIN:?ARDOR_PUBLIC_ORIGIN must be set}
      ARDOR_SHARE_SECRET: ${ARDOR_SHARE_SECRET:?ARDOR_SHARE_SECRET must be set}
      ARDOR_LEGACY_SHARE_LINKS: ${ARDOR_LEGACY_SHARE_LINKS:-on}
  web:
    image: ardor-web-staging:local
    build:
      context: ../apps/web
      dockerfile: ../../deploy/Dockerfile.web
    ports:
      !override
      # Loopback only: Caddy proxies 127.0.0.1:8080 and answers the public :8080 itself (redirect).
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
