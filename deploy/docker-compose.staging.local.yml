services:
  api:
    image: ardor-api-staging:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api.staging
    volumes:
      - ../alembic.ini:/app/alembic.ini:ro
      - ../migrations:/app/migrations:ro
    environment:
      ARDOR_ENV: staging
      DATABASE_URL: postgresql://ardor_user:${POSTGRES_PASSWORD}@postgres:5432/ardor_pressure_test
      STORAGE_DIR: /data/storage
      SECRET_KEY: ${ARDOR_JWT_SECRET}
  web:
    image: ardor-web-staging:local
    build:
      context: ../apps/web
      dockerfile: ../../deploy/Dockerfile.web
    ports:
      !override
      - "8080:80"
    volumes:
      - ./nginx.staging.conf:/etc/nginx/conf.d/default.conf:ro
  postgres:
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
