[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wika-cpg1500-graph"
version = "1.0.0"
description = "Автоматическая обработка и анализ CSV-файлов манометра WIKA CPG1500"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "openpyxl>=3.1.0",
    "charset-normalizer>=3.0.0",
    "fpdf2>=2.7.0",
    "pillow>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.27.0",
]
server = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "python-multipart>=0.0.9",
]

[tool.setuptools.packages.find]
where = ["src"]
